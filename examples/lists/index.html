<html>
    <head>
        <title>Example: Lists</title>
        <link rel="stylesheet" href="../../jtml.css"/>
        <link rel="stylesheet" href="../examples.css"/>
        <link rel="stylesheet" href="./lists.css"/>
    </head>
    <body>
        <script type="module">

            import {body, h1} from "../../jtml.js";
            import example from "../common/js/example.js";
            import footer from "../common/js/footer.js";
            import fixed from "./fixed.js";
            import clickable from "./clickable.js";
            import growable from "./growable.js";
            import mutable from "./mutable-items.js";
            import todo from "./todo.js";
            
            body(
                h1("Lists"),
                example("Fixed Lists", ...fixed).classes("inline-block"),
                example("Clickable", ...clickable).classes("inline-block"),
                example("Growable", growable).classes("inline-block"),
                example("Mutable Items", ...mutable).classes("inline-block"),
                example("To-Do List", todo).classes("inline-block"),
                footer
            );
