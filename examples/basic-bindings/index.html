<html>
    <head>
        <title>Example: Basic Bindings</title>
        <link rel="stylesheet" href="../../jtml.css"/>
        <link rel="stylesheet" href="../examples.css"/>
        <link rel="stylesheet" href="./basic-bindings.css"/>
    </head>
    <body id="body">
        <h1>Basic Bindings</h1>
        <script type="module">
            import {a, body, br, button, checkbox, div, h1, h2, scope, textField, span} from "../../jtml.js";

            body(
                
                div(
                    h2("Show/Hide"),
                    div(
                        div(
                            checkbox().bind("hide-red"), "Hide the red box"
                        ).classes("left inline-block"),
                        div(
                            div().classes("red square").hidden("hide-red"),
                        ).classes("right inline-block")
                    ),
                    div(
                        div(
                            checkbox().bind("hide-green"), "Hide the green box"
                        ).classes("left inline-block"),
                        div(
                            div().classes("green square").hidden("hide-green"),
                        ).classes("right inline-block")
                    )
                ).classes("example inline-block"),

                div(
                    h2("Enable/Disable"),
                    div(
                        div(
                            checkbox().bind("disable-hello"), "Disable 'Hello'"
                        ).classes("left inline-block"),
                        button("Hello").disabled("disable-hello").click(() => alert("Nice to meet you."))
                    ),
                    div(
                        div(
                            textField().bind("message"),
                            br(),
                            span("Type to enable the button").classes("tiny")
                        ).classes("left inline-block"),
                        button("Alert")
                            .disabled("message", message => !message || message.length === 0)
                            .click(jtml => alert("You typed: '" + jtml.get("message") + "'"))
                            .click(jtml => jtml.set("message", ""))
                    )
                ).classes("example inline-block"),

                div(
                    h2("Add/Remove Classes"),
                    div("Select the classes you want for the square:"),
                    div(
                        div(
                            div(checkbox().bind("square-border"), ".border"),
                            div(checkbox().bind("square-yellow"), ".yellow"),
                            div(checkbox().bind("square-bold"), ".bold"),
                            div(checkbox().bind("square-shadow"), ".shadow")
                        ).classes("inline-block"),
                        div("JTML!")
                            .id("text-square")
                            .classes("black-border square top-aligned centered-text inline-block")
                            .classes("border", "square-border")
                            .classes("yellow", "square-yellow")
                            .classes("bold",   "square-bold")
                            .classes("shadow", "square-shadow")
                    )
                ).classes("example inline-block"),

                div(
                    a("..", "Directory of JTML Examples")
                )

        )

            // div (
            //     h2("Nested Scopes"),
            //     div(
            //         "This is the outer <div>. Every 'bind' call in it refers to the default (shared) binder.",
            //         br(),
            //         checkbox().bind("checked"),

            //                 "checked"
            //             )
            //         ).classes("scope"),
            //         "This works even though both checkboxes are bound to the key 'checked'."
            //     ).classes("scope")
            // ).classes("example inline-block").addToDOM();

        </script>
    </body>
</html>
